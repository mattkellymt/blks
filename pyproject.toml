[project]
name = "blks"
version = "2026.8.13"
description = "Building blocks and shared utilities for Python projects"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "matt", email = "" }
]
requires-python = ">=3.11"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "torch>=2.13.0",
]

[project.urls]
Repository = "https://github.com/mattkellymt/blks"
Issues = "https://github.com/mattkellymt/blks/issues"

[build-system]

requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
