[project]
name = "blks"
version = "2026.8.30"
description = "Building blocks for AIML"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "matt" }
]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "huggingface-hub>=1.28.0",
    "safetensors>=0.8.0",
    "torch>=2.13.0",
    "transformers>=5.15.1",
]

[project.urls]
Repository = "https://github.com/mattkellymt/blks"
Issues = "https://github.com/mattkellymt/blks/issues"

[build-system]

requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
