name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  pypi-publish:
    name: Publish package to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for PyPI OIDC Trusted Publishing
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9
      - name: Build package
        run: uv build
      - name: Publish to PyPI
        run: uv publish
